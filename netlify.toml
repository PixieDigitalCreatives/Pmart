[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Forward all /api calls to custom domain backend api.thepmart.in
[[redirects]]
  from = "/api/*"
  to = "https://api.thepmart.in/api/:splat"
  status = 200
  force = true

# SPA Fallback: Required for React Router 7 client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers for frontend assets
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000"
    Permissions-Policy = "camera=(self), geolocation=(self), microphone=(), payment=(), usb=(), magnetometer=(), gyroscope=()"
    # Keep in step with vercel.json. connect-src lists the Render API used for sockets (and for /api if the web
    # app calls Render directly); change it if the API moves.
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://apis.google.com; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://api.thepmart.in wss://api.thepmart.in https://pmart-66mp.onrender.com wss://pmart-66mp.onrender.com https://api.maptiler.com https://*.googleapis.com; worker-src 'self' blob:; child-src blob:; frame-src https://*.firebaseapp.com https://*.web.app; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
