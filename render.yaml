# Render Blueprint for the PMart API (backend/). Dashboard → New → Blueprint → select this repo.
# Values marked `sync: false` are typed into the Render dashboard; they are never stored in git.
services:
  - type: web
    name: pmart-backend # keep this name: renaming creates a new service with a new URL
    runtime: node
    rootDir: backend
    region: singapore # closest Render region to India (region can't be changed after creation)
    plan: free # free sleeps after 15 min idle: first request takes ~1 min and live updates drop; use starter for real traffic
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: pmart
      - key: JWT_SECRET
        generateValue: true # Render generates a strong secret (production requires 32+ chars)
      - key: OTP_ENCRYPTION_KEY
        sync: false # 64 hex chars; once orders exist never change it
      - key: ALLOWED_ORIGINS
        sync: false # REQUIRED: exact web origin(s), e.g. https://thepmart.in,https://www.thepmart.in (comma-separated, https only, no * wildcards — the API won't start otherwise)
      # The web app (www.thepmart.in) calls api.thepmart.in directly: same site, so the session cookie is first-party.
      - key: COOKIE_SAME_SITE
        value: strict
      # Browser → Render (api.thepmart.in) → API = 1 proxy. Use 2 only if the web app goes through the Vercel /api
      # rewrite instead; with 2 and direct calls, any client can choose its own IP and dodge IP-based rate limits.
      - key: TRUST_PROXY
        value: "1"
      - key: OTP_LENGTH
        value: "4"
      - key: LOG_LEVEL
        value: info
      - key: MAPTILER_API_KEY
        sync: false # optional: server-side address lookup
      - key: FIREBASE_PROJECT_ID
        sync: false # optional: Google sign-in needs all three
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
