services:
  - type: web
    name: pmart-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: pmart
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_ENCRYPTION_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: COOKIE_SAME_SITE
        value: none
      - key: LOG_LEVEL
        value: info
