name: Render Keep Alive

on:
  schedule:
    # Runs every 10 minutes 24x7 to ensure Render free tier instance never sleeps
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping PMart API
        run: |
          echo "Pinging PMart Render API to keep active..."
          curl -s -f -m 30 --retry 3 --retry-delay 5 https://pmart-66mp.onrender.com/api/ping || curl -s -f -m 30 https://api.thepmart.in/api/ping || echo "Render service waking up / responded"

