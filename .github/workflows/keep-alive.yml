name: Render Keep Alive

on:
  schedule:
    # Runs every 14 minutes between 02:00 UTC and 18:30 UTC (7:30 AM to midnight IST).
    # Keeps Render awake during all active customer hours while staying comfortably within free-tier limits.
    - cron: '*/14 2-18 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping PMart API
        run: |
          curl -s -f -m 15 https://api.thepmart.in/api/ping || curl -s -f -m 15 https://pmart-66mp.onrender.com/api/ping || echo "Render service waking up"
